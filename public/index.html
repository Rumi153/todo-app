<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todo</title>
<style>
  :root { --bg:#f6f7f4; --ink:#1d2a24; --muted:#6b7a72; --line:#dfe4de; --accent:#2f6b4f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14201a; --ink:#e9efe9; --muted:#8fa196; --line:#25352c; --accent:#6fc79a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.5 Georgia, "Times New Roman", serif; }
  main { max-width:560px; margin:0 auto; padding:56px 20px; }
  h1 { font-size:2rem; margin:0 0 24px; font-weight:600; }
  form { display:flex; gap:8px; margin-bottom:24px; }
  input[type=text] { flex:1; padding:12px 14px; border:1px solid var(--line); border-radius:6px; background:transparent; color:inherit; font:inherit; }
  button { font:inherit; cursor:pointer; }
  .add { padding:12px 18px; border:0; border-radius:6px; background:var(--accent); color:var(--bg); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  ul { list-style:none; margin:0; padding:0; }
  li { display:flex; align-items:center; gap:12px; padding:14px 0; border-top:1px solid var(--line); }
  li.done span { text-decoration:line-through; color:var(--muted); }
  li span { flex:1; }
  .del { border:0; background:none; color:var(--muted); padding:4px 8px; }
  .msg { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Things to do</h1>
  <form id="f">
    <input type="text" id="t" placeholder="What needs doing?" aria-label="New task" required>
    <button class="add" type="submit">Add task</button>
  </form>
  <p class="msg" id="msg"></p>
  <ul id="list"></ul>
</main>
<script>
const api = "/api/todos", list = document.getElementById("list"), msg = document.getElementById("msg");
const call = async (method, body) => {
  const r = await fetch(api, { method, headers:{"Content-Type":"application/json"}, body: body && JSON.stringify(body) });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || "Request failed");
  return d;
};
async function load() {
  try {
    const todos = await call("GET");
    msg.textContent = todos.length ? "" : "No tasks yet. Add your first one above.";
    list.innerHTML = "";
    todos.forEach(t => {
      const li = document.createElement("li");
      if (t.done) li.className = "done";
      const cb = Object.assign(document.createElement("input"), { type:"checkbox", checked:t.done });
      cb.setAttribute("aria-label", "Mark done");
      cb.onchange = async () => { await call("PATCH", { id:t.id, done:cb.checked }); load(); };
      const s = document.createElement("span"); s.textContent = t.title;
      const d = document.createElement("button"); d.className = "del"; d.textContent = "Delete";
      d.onclick = async () => { await call("DELETE", { id:t.id }); load(); };
      li.append(cb, s, d); list.append(li);
    });
  } catch (e) { msg.textContent = "Could not load tasks: " + e.message; }
}
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const i = document.getElementById("t");
  try { await call("POST", { title:i.value }); i.value = ""; load(); }
  catch (err) { msg.textContent = "Could not add task: " + err.message; }
};
load();
</script>
</body>
</html>
